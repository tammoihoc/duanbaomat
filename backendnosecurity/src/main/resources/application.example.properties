# src/main/resources/application.properties
server.port=8080

# Database - Thêm createDatabaseIfNotExist=true
spring.datasource.url=jdbc:mysql://localhost:3308/shoppc_db_secure?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=shoppc_user_secure
spring.datasource.password=CHANGE_ME_DATABASE_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.shoppc.backendsecure=DEBUG
