# docker-compose-secure.yml - Cho phiên bản có bảo mật
version: '3.8'

services:
  mysql-secure:
    image: mysql:8.0
    container_name: shoppc_mysql_secure
    environment:
      MYSQL_ROOT_PASSWORD: CHANGE_ME_ROOT_PASSWORD
      MYSQL_DATABASE: shoppc_db_secure
      MYSQL_USER: shoppc_user_secure
      MYSQL_PASSWORD: CHANGE_ME_DATABASE_PASSWORD
    ports:
      - "3308:3306"  # Port khác với phiên bản cũ (3307)
    volumes:
      - mysql_data_secure:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped

volumes:
  mysql_data_secure:
